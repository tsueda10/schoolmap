<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京都の学校・教育施設マップ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font:16px system-ui,sans-serif;color:#172d44;background:#f1f6fc;display:flex;flex-direction:column;min-height:100vh}
header{padding:1rem 1.25rem}h1{margin:0 0 .6rem;font-size:1.4rem}p{margin:.5rem 0 0}
.controls{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}button,input{font:inherit}button{padding:.3rem .65rem;cursor:pointer}
#map{flex:1;min-height:55vh;background:#e0eaf1}.popup p{margin:.35rem 0 0}
</style>
</head>
<body>
<header>
<h1>東京都の学校・教育施設マップ</h1>
<div class="controls">
<label>GeoJSONを選択 <input id="file" type="file" accept=".geojson,.json,application/geo+json"></label>
<button id="all" type="button" disabled>全地点を表示</button>
</div>
<p id="basemap-note" hidden>OpenStreetMapで表示するには、このHTMLをローカルサーバー経由で開いてください。</p>
<p id="status" role="status">地図を準備しています…</p>
</header>
<div id="map" aria-label="学校・教育施設の地図"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(async () => {
  const filename = 'P29-23_13.geojson';
  const status = document.querySelector('#status');
  const fileInput = document.querySelector('#file');
  const allButton = document.querySelector('#all');
  if (!window.L) {
    status.textContent = '地図ライブラリを読み込めません。インターネット接続を確認してください。';
    return;
  }

  const map = L.map('map', {preferCanvas: true}).setView([35.70, 139.53], 10);
  const directOpen = location.protocol === 'file:';
  document.querySelector('#basemap-note').hidden = !directOpen;
  const gsi = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    maxNativeZoom: 18,
    maxZoom: 19,
    attribution: '背景地図：<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル（標準地図）</a>'
  });
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  });
  const basemap = (directOpen ? gsi : osm).addTo(map);
  if (!directOpen) {
    L.control.layers({'OpenStreetMap': osm, '地理院地図': gsi}, {}, {collapsed: false}).addTo(map);
  }
  basemap.on('tileerror', () => {
    status.title = '背景地図の一部を取得できませんでした。';
  });
  let layer;
  let loadId = 0;

  function render(data) {
    if (data.type !== 'FeatureCollection' || !Array.isArray(data.features)) {
      throw new Error('FeatureCollection が必要です。');
    }
    const nextLayer = L.geoJSON(data, {
      filter: feature => feature.geometry?.type === 'Point',
      pointToLayer: (_, latlng) => L.circleMarker(latlng, {
        radius: 5, color: '#fff', weight: 1, fillColor: '#1468ba', fillOpacity: 0.88
      }),
      onEachFeature: (feature, point) => {
        point.bindPopup(() => {
          const props = feature.properties ?? {};
          const content = document.createElement('div');
          content.className = 'popup';
          const name = document.createElement('strong');
          name.textContent = [props.P29_004 || '名称未登録', props.P29_009].filter(Boolean).join(' ');
          const address = document.createElement('p');
          address.textContent = props.P29_005 || '所在地未登録';
          content.append(name, address);
          return content;
        });
      }
    });
    const count = nextLayer.getLayers().length;
    if (!count) throw new Error('表示できる地点がありません。');
    layer?.remove();
    layer = nextLayer.addTo(map);
    allButton.disabled = false;
    status.textContent = `${count.toLocaleString('ja-JP')}地点を表示中。点を押すと施設名と所在地が表示されます。`;
  }

  allButton.addEventListener('click', () => {
    map.fitBounds(layer.getBounds(), {padding: [24, 24], maxZoom: 15});
  });
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const requestId = ++loadId;
    try {
      const data = JSON.parse(await file.text());
      if (requestId === loadId) render(data);
    } catch {
      if (requestId === loadId) status.textContent = '地点を読み込めませんでした。GeoJSONファイルを確認してください。';
    } finally {
      if (requestId === loadId) fileInput.value = '';
    }
  });

  const filePrompt = `上の「GeoJSONを選択」から ${filename} を選んでください。`;
  if (location.protocol === 'file:') {
    status.textContent = filePrompt;
    return;
  }
  try {
    const response = await fetch('./' + filename);
    if (!response.ok) throw new Error('GeoJSON fetch failed');
    const data = await response.json();
    if (loadId === 0) render(data);
  } catch {
    if (loadId === 0) status.textContent = '同じフォルダから自動で読み込めませんでした。' + filePrompt;
  }
})();
</script>
</body>
</html>
